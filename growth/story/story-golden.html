<!doctype html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;700&display=swap');
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#2a160c}
body{font-family:Inter,sans-serif;color:#fff;position:relative}
/* Higgsfield golden-hour clip, still image underneath as fallback */
.bg,.bg video{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.bg{background:url(golden-bg.png) center/cover}
/* Soft top fade for the headline, darker wall at the bottom for icons and URL */
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,15,10,.45) 0%,rgba(40,15,10,0) 28%,rgba(0,0,0,0) 62%,rgba(20,10,6,.55) 78%,rgba(15,8,5,.8) 100%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center}
h1{margin:270px 70px 0;font-family:'Instrument Serif';font-weight:400;font-size:118px;line-height:1;
 text-shadow:0 4px 30px rgba(120,40,0,.45)}
h1 i{display:block;color:#ffe2b8}
.spacer{flex:1}
.row{display:flex;gap:24px;padding:22px 26px;border-radius:44px;margin-bottom:40px;
 background:rgba(255,240,225,.14);border:1.5px solid rgba(255,235,210,.35);backdrop-filter:blur(14px)}
.ic{width:136px;height:136px;border-radius:31px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4);
 animation:float 3.5s ease-in-out infinite alternate}
.ic img{width:100%;height:100%;display:block}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.cta{font-family:'Instrument Serif';font-style:italic;font-size:72px;line-height:1}
.url{margin:18px 0 320px;font-size:34px;font-weight:700;letter-spacing:.02em;padding:16px 42px;border-radius:999px;
 background:#fff3e4;color:#5a2a12;box-shadow:0 10px 40px rgba(255,150,60,.35)}
</style></head><body>
<div class="bg"><video src="golden-bg.mp4" autoplay muted loop playsinline></video></div>
<div class="shade"></div>
<div class="wrap">
  <h1>some guys chase sunsets.<i>I build games.</i></h1>
  <div class="spacer"></div>
  <div class="row">
    <div class="ic"><img src="../../img/lifeline.png"></div>
    <div class="ic" style="animation-delay:-.7s"><img src="../../img/hardwood-gm.png"></div>
    <div class="ic" style="animation-delay:-1.4s"><img src="../../img/gridiron-gm.png"></div>
    <div class="ic" style="animation-delay:-2.1s"><img src="../../img/gatecrash-army.png"></div>
    <div class="ic" style="animation-delay:-2.8s"><img src="../../img/diamondedge.png"></div>
  </div>
  <div class="cta">come play</div>
  <div class="url">seanlynchgames.com</div>
</div>
</body></html>
