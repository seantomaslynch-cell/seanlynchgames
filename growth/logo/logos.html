<!doctype html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Space+Grotesk:wght@700&display=swap');
html,body{margin:0;width:1600px;background:#0b0e12;font-family:Inter,sans-serif;color:#fff}
.sheet{padding:60px;display:grid;gap:40px}
.opt{display:grid;grid-template-columns:200px 1fr 320px;align-items:center;gap:50px;background:#12161c;border:1px solid #222a33;border-radius:28px;padding:50px 60px}
.lbl{font-size:22px;font-weight:800;letter-spacing:.2em;color:#ffc21a}
.lbl small{display:block;margin-top:8px;font-size:17px;letter-spacing:0;font-weight:500;color:#8c96a0}
.lock{display:flex;align-items:center;gap:26px}
.tiles{display:flex;gap:24px;align-items:center}
.tile{width:150px;height:150px;border-radius:34px;display:grid;place-items:center;background:#101418;box-shadow:0 0 0 1px #2a323b}
.tile.light{background:#f4f1ea;box-shadow:none}
.tile.small{width:72px;height:72px;border-radius:17px}
/* A: wordmark text */
.wm b{display:block;font-weight:900;font-size:64px;letter-spacing:-.035em;line-height:.95}
.wm span{display:block;margin-top:8px;font-weight:700;font-size:24px;letter-spacing:.62em;color:#ffc21a}
/* B: monogram */
.mono{font-family:'Space Grotesk';font-weight:700;letter-spacing:-.09em;line-height:1;color:#fff}
.mono i{font-style:normal;color:#ffc21a}
/* C: pixel wordmark */
.pw{font-weight:800;font-size:72px;letter-spacing:-.045em;display:flex;align-items:baseline;gap:0}
.pw .px{display:inline-block;width:.2em;height:.2em;background:#ffc21a;margin:0 .14em 0 .08em;border-radius:2px}
.pw em{font-style:normal;font-weight:500;color:#8c96a0}
</style></head><body>
<div class="sheet">

<!-- A: double play mark -->
<div class="opt">
  <div class="lbl">OPTION A<small>Forward mark. Two play arrows, "next level".</small></div>
  <div class="lock">
    <svg width="120" height="120" viewBox="0 0 100 100"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f0a800"/></linearGradient></defs>
      <polygon points="20,24 20,76 52,50" fill="#ffc21a" opacity=".38" stroke="#ffc21a" stroke-opacity=".38" stroke-width="12" stroke-linejoin="round"/>
      <polygon points="44,24 44,76 80,50" fill="url(#ga)" stroke="url(#ga)" stroke-width="12" stroke-linejoin="round"/></svg>
    <div class="wm"><b>SEAN LYNCH</b><span>GAMES</span></div>
  </div>
  <div class="tiles">
    <div class="tile"><svg width="96" height="96" viewBox="0 0 100 100"><polygon points="20,24 20,76 52,50" fill="#ffc21a" opacity=".38" stroke="#ffc21a" stroke-opacity=".38" stroke-width="12" stroke-linejoin="round"/><polygon points="44,24 44,76 80,50" fill="url(#ga)" stroke="url(#ga)" stroke-width="12" stroke-linejoin="round"/></svg></div>
    <div class="tile light small"><svg width="48" height="48" viewBox="0 0 100 100"><polygon points="20,24 20,76 52,50" fill="#101418" opacity=".35" stroke="#101418" stroke-opacity=".35" stroke-width="12" stroke-linejoin="round"/><polygon points="44,24 44,76 80,50" fill="#101418" stroke="#101418" stroke-width="12" stroke-linejoin="round"/></svg></div>
  </div>
</div>

<!-- B: SL monogram -->
<div class="opt">
  <div class="lbl">OPTION B<small>SL monogram. Clean, works as an app icon.</small></div>
  <div class="lock">
    <div class="tile" style="width:120px;height:120px;border-radius:28px"><div class="mono" style="font-size:70px">S<i>L</i></div></div>
    <div class="wm"><b>SEAN LYNCH</b><span>GAMES</span></div>
  </div>
  <div class="tiles">
    <div class="tile"><div class="mono" style="font-size:88px">S<i>L</i></div></div>
    <div class="tile light small"><div class="mono" style="font-size:42px;color:#101418">S<i style="color:#d99600">L</i></div></div>
  </div>
</div>

<!-- C: wordmark with pixel -->
<div class="opt">
  <div class="lbl">OPTION C<small>Wordmark. A single gold pixel as the signature.</small></div>
  <div class="lock">
    <div class="pw">seanlynch<span class="px"></span><em>games</em></div>
  </div>
  <div class="tiles">
    <div class="tile"><div class="pw" style="font-size:62px">sl<span class="px"></span></div></div>
    <div class="tile light small"><div class="pw" style="font-size:30px;color:#101418">sl<span class="px"></span></div></div>
  </div>
</div>

</div>
</body></html>
