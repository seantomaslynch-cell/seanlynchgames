<!doctype html>
<!-- YouTube channel banner, 2560x1440. Everything that matters sits in the centre 1546x423 safe area. Render: py -3 yt_banner.py -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"Archivo";font-weight:400 900;font-stretch:62% 125%;src:url(../../fonts/archivo-latin.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:400 700;src:url(../../fonts/hanken-latin.woff2) format("woff2")}
html,body{margin:0;width:2560px;height:1440px;overflow:hidden}
body{position:relative;background:
  radial-gradient(ellipse 1100px 520px at 50% 50%,rgba(255,194,26,.13),transparent 70%),
  radial-gradient(ellipse 1600px 900px at 50% 45%,#1a2028,#0b0e12 75%)}
.wm{position:absolute;left:50%;top:50%;width:2300px;transform:translate(-50%,-50%);opacity:.035}
.rule{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#ffc21a 30%,#ffc21a 70%,transparent);opacity:.55}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center;gap:64px}
.tile{width:330px;height:330px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
.col{display:flex;flex-direction:column;gap:18px}
h1{margin:0;font:900 118px/0.95 "Archivo";font-stretch:78%;letter-spacing:1px;color:#fff;text-transform:uppercase}
h1 b{color:#ffc21a;font-weight:900}
p{margin:0 0 10px;font:600 40px/1.2 "Hanken Grotesk";color:#aab3bd}
.games{display:flex;gap:26px}
.games img{width:122px;height:122px;border-radius:27px;box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.08)}
</style></head><body>
<img class="wm" src="../../img/logo-mark.svg" alt="">
<div class="rule" style="top:478px"></div><div class="rule" style="top:958px"></div>
<div class="safe">
  <img class="tile" src="../../img/favicon.svg" alt="">
  <div class="col">
    <h1>Sean Lynch <b>Games</b></h1>
    <p>Games for iPhone and Android</p>
    <div class="games">
      <img src="../../img/lifeline.png"><img src="../../img/hardwood-gm.png"><img src="../../img/gridiron-gm.png"><img src="../../img/gatecrash-army.png"><img src="../../img/diamondedge.png">
    </div>
  </div>
</div>
</body></html>
